<svg width="400" height="400" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">Nulia — sell smarter</title>
<!-- Minimalist N monogram — pure geometry, no ornament -->
<rect width="120" height="120" rx="28" fill="#0A0A0A"/>
<!-- N — three strokes, equal weight, optical correction -->
<g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M36 34 L36 86" stroke-width="7"/>
  <path d="M36 34 L84 86" stroke-width="7"/>
  <path d="M84 34 L84 86" stroke-width="7"/>
</g>
<!-- Single accent — quiet confidence -->
<circle cx="84" cy="31.5" r="3.2" fill="#E8B86A"/>
<!-- Wordmark — generous tracking, no subtitle clutter -->
<text x="60" y="109" text-anchor="middle" font-family="Inter, SF Pro, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="750" letter-spacing="4.2" fill="#FFFFFF">NULIA</text>
</svg>
