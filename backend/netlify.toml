[build]
  command = "echo 'Backend is functions-only, no build needed'"
  functions = "functions"
  publish = "public"

[dev]
  # Explicitly tell Netlify: NO framework, functions only!
  command = ""
  framework = "#static"
  targetPort = 8888
  port = 8888
  functions = "functions"
  functionsPort = 8888
  publish = "public"

[functions]
  directory = "functions"
  node_bundler = "esbuild"
  
# Disable automatic framework detection
[build.environment]
  NODE_VERSION = "20"
